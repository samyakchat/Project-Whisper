<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Whisper</title>
  <style>
    body {
      background-color: #000;
      color: #ffcc00;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      margin: 0;
    }

    h1 {
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
      text-shadow: 0 0 10px #ffcc00;
    }

    .auth-box {
      border: 2px solid #ffcc00;
      border-radius: 8px;
      padding: 20px 30px;
      background: #000;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
    }

    label {
      font-size: 1.1rem;
      margin-right: 10px;
    }

    input[type="password"] {
      background: black;
      border: 1px solid #ffcc00;
      border-radius: 4px;
      padding: 8px 12px;
      color: #ffcc00;
      font-family: "Courier New", monospace;
      font-size: 1rem;
      outline: none;
      width: 250px;
    }

    input[type="password"]:focus {
      box-shadow: 0 0 8px #ffcc00;
    }

    button {
      margin-top: 20px;
      width: 100%;
      background: black;
      border: 2px solid #ffcc00;
      border-radius: 6px;
      padding: 10px;
      color: #ffcc00;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #ffcc00;
      color: black;
      box-shadow: 0 0 15px #ffcc00;
    }

    .error {
      color: #ff4d4d;
      font-size: 0.9rem;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Project Whisper</h1>
  <div class="auth-box">
    <form id="authForm">
      <label for="authKey">Auth Key</label>
      <input type="password" id="authKey" placeholder="Enter Key">
      <button type="submit">SUBMIT</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script>
    // List of valid authentication keys
    const validKeys = ["ATHENA123", "ENIGMA42", "WHISPER88", "CODEX1945"];

    const form = document.getElementById("authForm");
    const input = document.getElementById("authKey");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const enteredKey = input.value.trim();

      if (validKeys.includes(enteredKey)) {
        window.location.href = "operation_athena.html";
      } else {
        errorMsg.textContent = "ACCESS DENIED: Invalid Key";
        input.value = "";
      }
    });
  </script>
</body>
</html>
